name: Validate LangGraph agent
on:
  pull_request:
    paths:
      - 'agentic_ai/**'
      - '.github/workflows/agentic-python.yml'
  push:
    branches: [main]
    paths:
      - 'agentic_ai/**'
permissions:
  contents: read
jobs:
  python-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q agentic_ai
      - name: Install agent dependencies
        run: python -m pip install -r agentic_ai/requirements.txt
      - name: Exercise graph scenarios without API key
        run: python -m unittest discover -s agentic_ai/tests -v
